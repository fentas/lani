# The app's release APK, attached to the GitHub release of a tag (docs/releasing.md).
#
# On a tag v* (and on "Run workflow" from a tag) it builds the release APK in the build image, as
# companion/bin/lani-build-app does on any machine, signs it with the release key from the repository's secrets and
# attaches lani-<versionName>.apk, its SHA-256 (.sha256) and lani-<versionName>.json (versionCode, versionName, file,
# sha256: what companion/bin/release-app --github reads) to the release, which it creates if needed.
#
# Secrets (companion/bin/lani-keystore makes the key and prints the commands): LANI_KEYSTORE_B64 (the keystore in
# base64), LANI_KEYSTORE_PASSWORD, LANI_KEY_ALIAS, LANI_KEY_PASSWORD. Without them, and on a run from a branch, the APK
# is only a workflow artifact: one signed with a throwaway key couldn't update an installed app, so it is no release.
name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.apk.outputs.version }}
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version is the commit count (app/build.gradle.kts): the whole history
          persist-credentials: false

      # The Gradle cache CI saves (ci.yml); a release only reads it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/lani/android-build/.gradle/caches
            ~/.cache/lani/android-build/.gradle/wrapper
            ~/.cache/lani/android-build/.m2
          key: android-gradle-${{ runner.os }}-${{ hashFiles('companion/android/gradle/libs.versions.toml', 'companion/android/gradle/wrapper/gradle-wrapper.properties', 'companion/android/**/*.gradle.kts', 'companion/android/docker/Dockerfile') }}
          restore-keys: android-gradle-${{ runner.os }}-

      - name: Release key
        id: key
        env:
          LANI_KEYSTORE_B64: ${{ secrets.LANI_KEYSTORE_B64 }}
        run: |
          if [ -z "$LANI_KEYSTORE_B64" ]; then
            echo "::warning::No release key (the secret LANI_KEYSTORE_B64): the APK is signed with a throwaway debug key and only kept as a workflow artifact."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$LANI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "LANI_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the release APK (companion/bin/lani-build-app)
        env:
          LANI_KEYSTORE_PASSWORD: ${{ secrets.LANI_KEYSTORE_PASSWORD }}
          LANI_KEY_ALIAS: ${{ secrets.LANI_KEY_ALIAS }}
          LANI_KEY_PASSWORD: ${{ secrets.LANI_KEY_PASSWORD }}
        run: companion/bin/lani-build-app --release --out "$RUNNER_TEMP/out/"

      - name: Check the signature
        env:
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          certs="$(companion/bin/lani-build-app --exec apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk)"
          echo "$certs"
          if [ "$SIGNED" = true ] && grep -q 'CN=Android Debug' <<< "$certs"; then
            echo "::error::The release key is set, but the APK is signed with a debug key."
            exit 1
          fi

      - name: Forget the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Checksum and version file
        id: apk
        run: |
          meta=companion/android/app/build/outputs/apk/release/output-metadata.json
          code="$(jq -r '.elements[0].versionCode' "$meta")"
          version="$(jq -r '.elements[0].versionName' "$meta")"
          cd "$RUNNER_TEMP/out"
          apk="lani-$version.apk"
          sha256sum "$apk" > "$apk.sha256"
          jq -n --arg file "$apk" --arg name "$version" --argjson code "$code" \
            --arg sha256 "$(cut -d' ' -f1 "$apk.sha256")" --arg commit "$GITHUB_SHA" \
            '{applicationId: "si.lanisce.lani", versionCode: $code, versionName: $name, file: $file, sha256: $sha256, commit: $commit}' \
            > "lani-$version.json"
          cat "lani-$version.json"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::warning::The tag $GITHUB_REF_NAME is not v$version, the version of its commit (0.2.<commit count>)."
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lani-${{ steps.apk.outputs.version }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach to the release
    needs: build
    if: github.ref_type == 'tag' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lani-${{ needs.build.outputs.version }}
          path: out

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha="$(cut -d' ' -f1 "out/lani-$VERSION.apk.sha256")"
          cat > notes.md << EOF
          Lani $VERSION, built from $GITHUB_SHA by the release workflow.

          - **lani-$VERSION.apk**: the app, for Android 8.0 or later. An app installed from these releases updates to
            the next one; an app built with another key (a debug build) has to be uninstalled first.
          - SHA-256: \`$sha\` (lani-$VERSION.apk.sha256). The same commit built with
            \`companion/bin/lani-build-app --release\` and the same key gives the same bytes.
          - A bridge offers it to its app's self-update with \`companion/bin/release-app --github $TAG\`.
          EOF
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Lani $VERSION" --notes-file notes.md
          fi
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber

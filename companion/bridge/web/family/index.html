<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b4492f">
  <meta name="referrer" content="no-referrer">
  <title>Lani</title>
  <link rel="stylesheet" href="/family/style.css">
  <script src="/family/app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1 id="title">💌 Lani</h1>
      <button id="open-settings" class="ghost" type="button" data-t-aria="settings" hidden>⚙️</button>
    </div>
    <p class="sub" id="subtitle"></p>
  </header>

  <main>
    <section id="locked" class="card" hidden>
      <h2 data-prefix="🔒 " data-t="lockedTitle"></h2>
      <p data-t="lockedText"></p>
    </section>

    <section id="settings" class="card" hidden>
      <h2 data-prefix="👋 " data-t="whoTitle"></h2>
      <form id="settings-form">
        <label><span data-t="yourName"></span>
          <input id="set-name" maxlength="40" required autocomplete="given-name">
        </label>
        <div class="label" data-t="yourEmoji"></div>
        <div id="set-emoji" class="emoji-row" role="radiogroup"></div>
        <label id="from-field"><span data-t="fromForm"></span>
          <input id="set-from" maxlength="40" placeholder="Maje">
        </label>
        <p class="small"><span data-t="whoSees"></span> <b id="set-preview"></b></p>
        <button class="primary" type="submit" data-t="save"></button>
      </form>
    </section>

    <section id="towns" class="card" hidden>
      <h2 data-prefix="🤝 " data-t="friends"></h2>
      <p class="small" id="towns-intro"></p>
      <ul id="towns-requests" class="requests"></ul>
      <div id="towns-linked-wrap" hidden>
        <div class="label" data-t="linkedTowns"></div>
        <ul id="towns-linked" class="linked"></ul>
      </div>
    </section>

    <section id="compose" class="card" hidden>
      <h2 data-prefix="✍️ " data-t="newMessage"></h2>
      <form id="compose-form">
        <div class="label" data-t="type"></div>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="type" value="question" checked><span>❓ <b data-t-target="question"></b><br><small data-t-base="questionLong"></small></span></label>
          <label><input type="radio" name="type" value="translate"><span>🔁 <b data-t-target="translate"></b><br><small data-t-base="translateLong"></small></span></label>
          <label><input type="radio" name="type" value="say"><span>🗣️ <b data-t-target="say"></b><br><small data-t-base="sayLong"></small></span></label>
        </div>
        <label><span id="text-label"></span>
          <textarea id="c-text" maxlength="500" rows="3" required></textarea>
        </label>
        <label><span data-t="hintLabel"></span>
          <input id="c-hint" maxlength="300">
        </label>
        <p class="small" data-t="hintNote"></p>
        <button class="primary" type="submit" id="c-send" data-t="sendTo"></button>
      </form>
    </section>

    <section id="thread-wrap" hidden>
      <h2 class="section-title" data-prefix="💬 " data-t="conversations"></h2>
      <div id="thread"></div>
    </section>

    <section id="record" class="card" hidden>
      <h2 data-prefix="🎙️ " data-t="recordWords"></h2>
      <p class="small" data-t="recordAbout"></p>
      <label><span data-t="recordingAs"></span>
        <input id="rec-as" maxlength="40">
      </label>
      <div class="custom">
        <input id="custom-text" maxlength="200" data-t-placeholder="anyPhrase">
        <button id="custom-rec" class="round" type="button" data-t-aria="record">⏺</button>
      </div>
      <div class="tabs" role="tablist">
        <button type="button" data-tab="missing" class="on" id="tab-missing"></button>
        <button type="button" data-tab="done" id="tab-done"></button>
      </div>
      <ul id="words" class="words"></ul>
    </section>
  </main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-text">
      <p class="small" data-t="readAloud"></p>
      <p id="sheet-text" class="big"></p>
      <p id="sheet-status" class="small"></p>
      <div class="sheet-actions">
        <button id="rec-btn" class="rec" type="button">⏺</button>
      </div>
      <div class="sheet-actions" id="after-rec" hidden>
        <button id="rec-play" type="button" data-prefix="▶ " data-t="listen"></button>
        <button id="rec-again" type="button" data-prefix="🔁 " data-t="again"></button>
        <button id="rec-save" class="primary" type="button" data-prefix="✅ " data-t="save"></button>
      </div>
      <button id="sheet-close" class="ghost" type="button" data-t="close"></button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>

[versions]
agp = "9.2.1"
kotlin = "2.4.0"
composeBom = "2026.05.01"
activity = "1.13.0"
lifecycle = "2.10.0"
coreKtx = "1.17.0"
datastore = "1.1.7"
okhttp = "4.12.0"
serialization = "1.9.0"
junit = "4.13.2"
work = "2.11.2"
camerax = "1.6.2"
zxing = "3.5.4"
icu4j = "78.3"
media3 = "1.11.1"
robolectric = "4.17"
androidxTestCore = "1.7.0"
# The phone's offline voice (Piper through sherpa-onnx, Apache-2.0): the AAR with onnxruntime linked in (settings.gradle.kts).
sherpaOnnx = "1.13.8"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
# The car ("Za pot · For the road"): a media library service that Android Auto and Bluetooth controls play.
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
junit = { module = "junit:junit", version.ref = "junit" }
# The road's player over a real ExoPlayer and session in the unit tests (road/RoadPlayerTest): Robolectric and media3's
# test utilities (a fake clock, fake renderers), test only.
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
media3-test-utils = { module = "androidx.media3:media3-test-utils", version.ref = "media3" }
media3-test-utils-robolectric = { module = "androidx.media3:media3-test-utils-robolectric", version.ref = "media3" }
# Pairing by QR code: CameraX and ZXing, no Google Play services (an F-Droid build stays possible).
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
# ICU for the unit tests' plural rules: android.icu is ICU4J repackaged, and a plain JVM has only its stubs.
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
